<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魏 · 网站与小程序作品集</title>
<meta name="description" content="四个演示作品：门店单页、企业官网、浏览器插件、微信小程序。">
<style>
:root{
  --bg:#0D1012; --panel:#171B1E; --ink:#F4F7F1; --dim:#9AA3A8; --line:rgba(255,255,255,.12);
  --neon:#C6F432; --font:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(18px,5vw,40px)}
.grid-bg{position:fixed;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 72px),
                   repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 72px)}
.glow{position:fixed;right:-260px;top:-260px;width:720px;height:720px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 42% 42%,rgba(198,244,50,.14),transparent 64%)}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--neon);text-transform:uppercase}
h1{font-size:clamp(28px,5vw,46px);line-height:1.2;font-weight:900;letter-spacing:-.01em;margin:12px 0 14px;overflow-wrap:anywhere}
h1 .hl{background:var(--neon);color:#0D1012;padding:2px 12px 5px;border-radius:6px}
.lede{color:var(--dim);font-size:16px;max-width:52ch}
.list{display:grid;gap:14px;margin:38px 0 10px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;text-decoration:none;transition:.18s}
.item:hover{border-color:var(--neon);transform:translateY(-2px)}
.item .n{font-size:20px;font-weight:900;color:var(--neon)}
.item h2{font-size:19px;font-weight:800;margin-bottom:4px}
.item p{font-size:14px;color:var(--dim)}
.item .go{font-size:14px;font-weight:700;color:var(--neon);white-space:nowrap}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:640px){
  .item{grid-template-columns:minmax(0,1fr);gap:8px}
  .item .n{font-size:14px;letter-spacing:.16em}
  .item .go{justify-self:start}
}
</style>
</head>
<body>
<div class="grid-bg"></div><div class="glow"></div>
<div class="wrap">
  <p class="eyebrow">Web &amp; Mini Program</p>
  <h1>四个作品，<br>四种<span class="hl">交付物</span></h1>
  <p class="lede">都是演示项目：品牌与内容均为虚构，用来展示页面结构、响应式和技术实现。点进去可以真操作。</p>

  <div class="list">
    <a class="item" href="01-cafe/">
      <div class="n">01</div>
      <div><h2>门店单页官网</h2><p>咖啡店 · 单文件静态页 · 表单与门店信息</p></div>
      <div class="go">打开 →</div>
    </a>
    <a class="item" href="02-corp/">
      <div class="n">02</div>
      <div><h2>企业官网（5 页）</h2><p>工业设备 · 多页面站点 · 参数表格与案例页</p></div>
      <div class="go">打开 →</div>
    </a>
    <a class="item" href="03-plugin/预览-插件界面.png">
      <div class="n">03</div>
      <div><h2>浏览器插件（取色器）</h2><p>Chrome 扩展 · 读取网页配色与字体 · 点这里看界面</p></div>
      <div class="go">看界面 →</div>
    </a>
    <a class="item" href="04-miniprogram/预览-三屏.png">
      <div class="n">04</div>
      <div><h2>微信小程序（课预约）</h2><p>瑜伽馆 · 3 个页面 · 课程表与预约表单</p></div>
      <div class="go">看三屏 →</div>
    </a>
  </div>

  <div class="foot">
    <span>需要类似的网站 / 小程序，可以找我聊需求</span>
    <span>演示内容均为虚构</span>
  </div>
</div>
</body>
</html>
