:root{--bg:#0D1012;--panel:#171B1E;--ink:#F4F7F1;--dim:#9AA3A8;--line:rgba(255,255,255,.12);--neon:#C6F432;

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;

p{color:var(--dim);font-size:15px}
.links{margin-top:22px;display:grid;gap:10px}
a.btn{display:block;text-align:center;text-decoration:none;background:var(--neon);color:#0D1012;
  font-weight:800;padding:13px 18px;border-radius:999px}
a.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:700}
</style>
</head>
